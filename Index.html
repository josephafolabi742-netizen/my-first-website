<!Doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> software developer</title>

<style>
  *{
    box-sizing: border-box;
    }

  body {
    background-color: lightblue;
    font-family: Arial;
    line-height: 1.6;
    }
  
  h1{
    color: darkblue;
    }

  h2{
    color: green;
    }

  p{
    margin-bottom: 20px;
    color:#333333;
    }

  .about{
    background-color:lightyellow;
    color:darkgreen;
     border-radius: 12px;
    font-size:14px;
    padding: 25px;
    border: 1px solid grey;
    margin-top: 20px;
    }

  .button{
    background-color:darkblue;
    color:white;
    border-radius: 6px;
    border:none;
    padding:12px 20px ;
    font-size: 16px;
    }

  .button:hover{
    background-color:green;
    }
  .button:active{
    background-color:orange;
    transform:scale(0.95;
    }
  </style>
  </head>
  
  <body>
  <h1>Hello, my name is joseph a software developer.</h1>
      <p>I am learning to build websites using HTML and CSS.</p>

    <div class="about">
      <h2>About me</h2>
      <p>i want to become a software developer.</p>
      </div>
<h2>My Goals</h2>
<p>I want to become a full-stack software engineer.</p>
    <button class="button">contact me</button>
    </body>
    </html>
